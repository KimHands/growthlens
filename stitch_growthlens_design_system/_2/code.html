<body class="min-h-screen flex flex-col relative pb-[64px]">
<!-- Header (TopAppBar) -->
<header class="flex justify-between items-center h-[64px] px-[20px] w-full bg-[#ffffff] sticky top-0 z-50"><div class="flex items-center gap-[8px]">
<img src="{{DATA:IMAGE:IMAGE_13}}" alt="Logo" class="w-[28px] h-[28px]">
<h1 class="font-headline-lg text-headline-lg font-bold text-[#007F5F]">GrowthLens</h1>
</div>
<div class="flex items-center gap-[16px] text-[#1A2E0D]">
<span class="material-symbols-outlined" style="font-size: 24px;">notifications</span>
<span class="material-symbols-outlined" style="font-size: 24px;">settings</span>
</div></header>
<!-- Main Content Canvas -->
<main class="flex-1 px-[20px] py-[20px] flex flex-col gap-[20px] overflow-y-auto">
<!-- Page Title Block -->
<div class="flex flex-col gap-[4px]">
<h2 class="font-headline-lg text-headline-lg font-bold text-[#1A2E0D]">오늘의 습관</h2>
<p class="font-body-md text-body-md text-[#4B5563]">일관된 성장을 위한 일일 목표예요</p>
</div>
<!-- Card 1 (Hero Streak) -->
<div class="gradient-growth rounded-[16px] p-[20px] flex flex-col gap-[20px] text-white">
<div class="flex justify-between items-start">
<span class="text-[40px] leading-none">🔥</span>
<div class="text-right flex flex-col gap-[4px]">
<span class="font-label-lg text-label-lg text-white/80">연속 달성</span>
<span class="font-headline-lg text-[40px] leading-[48px] font-bold">7일</span>
<span class="font-body-md text-body-md text-white/90">이번 주도 꾸준해요!</span>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-[6px] bg-white/30 rounded-full overflow-hidden">
<div class="h-full bg-white/90 rounded-full" style="width: 70%;"></div>
</div>
</div>
<!-- Card 2 (Habit Checklist) -->
<div class="bg-[#ffffff] rounded-[16px] border-custom ambient-shadow p-[20px] flex flex-col gap-[16px]">
<div class="flex justify-between items-center pb-[8px]">
<h3 class="font-headline-sm text-headline-sm font-semibold text-[#1A2E0D]">오늘 할 일</h3>
<span class="bg-[#ECFCCB] text-[#007F5F] font-label-sm text-label-sm px-[10px] py-[4px] rounded-full">2/3</span>
</div>
<ul class="flex flex-col gap-[16px]">
<!-- Checked Item -->
<li class="flex items-center gap-[12px] opacity-70">
<span class="material-symbols-outlined text-[#007F5F]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-lg text-body-lg text-[#1A2E0D] line-through">영단어 50개</span>
</li>
<!-- Unchecked Item 1 -->
<li class="flex items-center gap-[12px]">
<span class="material-symbols-outlined text-[#E5E7DA]">radio_button_unchecked</span>
<span class="font-body-lg text-body-lg text-[#1A2E0D]">코딩 테스트 1문제</span>
</li>
<!-- Unchecked Item 2 -->
<li class="flex items-center gap-[12px]">
<span class="material-symbols-outlined text-[#E5E7DA]">radio_button_unchecked</span>
<span class="font-body-lg text-body-lg text-[#1A2E0D]">운동 30분</span>
</li>
</ul>
<button class="text-[#007F5F] font-label-lg text-label-lg font-semibold text-left mt-[8px]">
                + 새 습관 추가
            </button>
</div>

<nav class="fixed bottom-0 w-full h-[64px] bg-[#ffffff] border-t border-[#E5E7DA] flex justify-around items-center z-50 md:hidden pb-safe">

<div class="flex flex-col items-center gap-[4px] text-[#6B7280]">
<span class="material-symbols-outlined" data-icon="home">home</span>

<div class="flex flex-col items-center gap-[4px] text-[#007F5F]">

</div>

<div class="flex flex-col items-center gap-[4px] text-[#6B7280]">

</div>

<div class="flex flex-col items-center gap-[4px] text-[#6B7280]">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-[10px]">프로필</span>
</div>
