services:
  - type: web
    name: growthlens-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ALLOW_ORIGINS
        sync: false # Render 대시보드에서 Vercel 도메인을 콤마로 설정
